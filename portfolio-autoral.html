    >

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================================
           PÁGINA DE PORTFÓLIO — AUTORAL
        ========================================================= */

        .portfolio-page {
            padding: 170px 5vw 100px;
        }

        .portfolio-page-header {
            max-width: 900px;
            margin-bottom: 100px;
        }

        .portfolio-page-number {
            display: block;
            margin-bottom: 24px;

            font-size: 11px;
            letter-spacing: 0.18em;
            text-transform: uppercase;

            opacity: 0.55;
        }

        .portfolio-page-title {
            margin: 0 0 30px;

            font-family: "Playfair Display", serif;
            font-size: clamp(60px, 10vw, 150px);
            font-weight: 400;
            line-height: 0.9;
            letter-spacing: -0.04em;
        }

        .portfolio-page-intro {
            max-width: 600px;

            font-size: 16px;
            line-height: 1.8;
            font-weight: 300;

            opacity: 0.7;
        }


        /* =========================================================
           GALERIA
        ========================================================= */

        .portfolio-gallery {
            display: grid;

            grid-template-columns: repeat(12, 1fr);

            gap: 18px;

            width: 100%;
        }

        .portfolio-gallery-item {
            position: relative;

            display: block;

            overflow: hidden;

            background: #151515;

            text-decoration: none;
        }

        .portfolio-gallery-item img {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transition:
                transform 0.8s cubic-bezier(.2, .7, .2, 1),
                opacity 0.6s ease;
        }

        .portfolio-gallery-item:hover img {
            transform: scale(1.04);
            opacity: 0.82;
        }


        /* =========================================================
           TAMANHOS DAS FOTOS
        ========================================================= */

        .gallery-wide {
            grid-column: span 8;
            aspect-ratio: 16 / 9;
        }

        .gallery-small {
            grid-column: span 4;
            aspect-ratio: 4 / 5;
        }

        .gallery-half {
            grid-column: span 6;
            aspect-ratio: 4 / 5;
        }

        .gallery-large {
            grid-column: span 8;
            aspect-ratio: 4 / 5;
        }

        .gallery-third {
            grid-column: span 4;
            aspect-ratio: 4 / 5;
        }

        .gallery-full {
            grid-column: 1 / -1;
            aspect-ratio: 16 / 8;
        }


        /* =========================================================
           RODAPÉ
        ========================================================= */

        .portfolio-page-footer {
            display: flex;

            justify-content: space-between;
            align-items: center;

            margin-top: 100px;
            padding-top: 30px;

            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        .portfolio-back {
            display: inline-flex;

            align-items: center;
            gap: 12px;

            color: #fff;

            font-size: 12px;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            text-decoration: none;

            opacity: 0.65;

            transition: opacity 0.3s ease;
        }

        .portfolio-back:hover {
            opacity: 1;
        }


        /* =========================================================
           RESPONSIVO
        ========================================================= */

        @media (max-width: 900px) {

            .portfolio-page {
                padding: 140px 5vw 80px;
            }

            .portfolio-page-header {
                margin-bottom: 70px;
            }

            .portfolio-gallery {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .gallery-wide,
            .gallery-large,
            .gallery-full {
                grid-column: span 2;
            }

            .gallery-small,
            .gallery-half,
            .gallery-third {
                grid-column: span 1;
            }
        }


        @media (max-width: 600px) {

            .portfolio-page {
                padding: 120px 20px 60px;
            }

            .portfolio-page-title {
                font-size: 70px;
            }

            .portfolio-page-intro {
                font-size: 14px;
            }

            .portfolio-gallery {
                display: grid;

                grid-template-columns: 1fr;

                gap: 10px;
            }

            .gallery-wide,
            .gallery-small,
            .gallery-half,
            .gallery-large,
            .gallery-third,
            .gallery-full {
                grid-column: span 1;

                aspect-ratio: 4 / 5;
            }

            .gallery-wide,
            .gallery-full {
                aspect-ratio: 4 / 3;
            }

            .portfolio-page-footer {
                margin-top: 70px;
            }
        }

    </style>
